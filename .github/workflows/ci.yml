name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches-ignore: ["main"]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: uv sync --only-group dev --locked

      - name: Run lint check
        run: uv run --no-sync ruff check .

      - name: Run format check
        run: uv run --no-sync ruff format --check .

      - name: Run deterministic unit tests with coverage
        run: >-
          uv run --no-sync
          --with pytest-cov==7.1.0
          --with coverage==7.14.0
          pytest
          --cov=src.training_config
          --cov-report=term-missing
          --cov-report=xml
